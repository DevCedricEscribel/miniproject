<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Drill Alarm PWA</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
body { font-family: Arial; text-align:center; background:#111; color:#fff; padding:20px; }
button { padding:15px 25px; font-size:18px; margin:10px; border:none; border-radius:8px; cursor:pointer; }
.admin { background:#c62828; color:#fff; }
.stop { background:#2e7d32; }
.install { background:#1976d2; color:#fff; }
.status { margin-top:20px; font-size:20px; }
.info { margin-top:10px; font-size:14px; color:#ccc; }
</style>
</head>
<body>

<h1>🔥 Fire Drill Alarm</h1>
<button class="admin" onclick="triggerAlarm()">ADMIN: TRIGGER FIRE ALARM</button>
<button class="stop" onclick="stopAlarm()">STOP ALARM</button>
<button class="install" id="installBtn" style="display:none;">Install App</button>
<div class="status" id="status">Status: Idle</div>
<div class="info" id="iosInfo" style="display:none;">
  iOS users: Tap the Share icon → Add to Home Screen
</div>

<script>
let torchTrack = null;
let alarmInterval = null;
let deferredPrompt;

// FIREBASE REAL-TIME LISTENER
db.ref('fireAlarm/active').on('value', async (snapshot) => {
  const active = snapshot.val();
  const status = document.getElementById('status');
  if (active) {
    status.innerText = "🚨 FIRE ALARM ACTIVE!";
    startVibration();
    await turnOnFlashlight();
  } else {
    status.innerText = "✅ Alarm Stopped";
    stopVibration();
    turnOffFlashlight();
  }
});

// ADMIN FUNCTIONS
function triggerAlarm() {
  db.ref('fireAlarm').set({
    active: true,
    timestamp: Date.now()
  });
}
function stopAlarm() {
  db.ref('fireAlarm').set({
    active: false,
    timestamp: Date.now()
  });
}

// VIBRATION
function startVibration() {
  if (navigator.vibrate) {
    alarmInterval = setInterval(() => navigator.vibrate([500, 300, 500]), 1300);
  }
}
function stopVibration() {
  clearInterval(alarmInterval);
  navigator.vibrate(0);
}

// FLASHLIGHT
async function turnOnFlashlight() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const track = stream.getVideoTracks()[0];
    torchTrack = track;
    const capabilities = track.getCapabilities();
    if (capabilities.torch) {
      await track.applyConstraints({ advanced: [{ torch: true }] });
    }
  } catch (err) {
    console.log("Flashlight error:", err);
  }
}
function turnOffFlashlight() {
  if (torchTrack) {
    torchTrack.stop();
    torchTrack = null;
  }
}

/* INSTALL BUTTON LOGIC */

// Android & Desktop (Chrome, Edge, etc.)
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('installBtn');
  installBtn.style.display = 'inline-block';
  installBtn.onclick = async () => {
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('User choice:', outcome);
    deferredPrompt = null;
  };
});

// iOS Detection & Guide
const isIos = () => {
  return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
};
const isInStandaloneMode = () => ('standalone' in window.navigator && window.navigator.standalone);

if (isIos() && !isInStandaloneMode()) {
  document.getElementById('iosInfo').style.display = 'block';
}
</script>

</body>
</html>
