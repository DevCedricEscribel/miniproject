<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Drill Alert</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card p-4 text-center w-100" style="max-width: 420px;">
    <h3 class="mb-3">🚨 Fire Drill Alert</h3>
    <p class="text-muted">
      Your phone will vibrate when a fire is reported.
    </p>

    <div id="status" class="alert alert-secondary">
      No active fire alert
    </div>

    <button class="btn btn-danger btn-lg w-100 mt-3" onclick="startFireAlert()">
      🔥 Sample Fire Drill
    </button>

    <button class="btn btn-outline-dark w-100 mt-2" onclick="stopFireAlert()">
      Stop Alert
    </button>
  </div>
</div>

<script>
  let vibrationTimer = null;

  function startFireAlert() {
    const status = document.getElementById("status");

    status.className = "alert alert-danger";
    status.innerHTML = "🚨 FIRE DETECTED! Evacuate immediately!";

    if (!("vibrate" in navigator)) {
      alert("Vibration is not supported on this device.");
      return;
    }

    // Strong vibration pattern
    const vibrationPattern = [1200, 400, 1200, 400, 1200];

    // Initial vibration
    navigator.vibrate(vibrationPattern);

    // Repeat vibration every 5 seconds
    vibrationTimer = setInterval(() => {
      navigator.vibrate(vibrationPattern);
    }, 5000);
  }

  function stopFireAlert() {
    const status = document.getElementById("status");

    status.className = "alert alert-secondary";
    status.innerHTML = "No active fire alert";

    if ("vibrate" in navigator) {
      navigator.vibrate(0); // Stop vibration
    }

    clearInterval(vibrationTimer);
    vibrationTimer = null;
  }
</script>

</body>
</html>
