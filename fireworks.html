
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Year Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at bottom, #020111, #000);
  color: #fff;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.container {
  z-index: 2;
  text-align: center;
  padding: 15px;
  width: 100%;
  max-width: 420px;
}

h1 {
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  margin-bottom: 15px;
}

.timer {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.time-box {
  background: rgba(255,255,255,0.12);
  padding: 14px 10px;
  border-radius: 14px;
}

.number {
  font-size: clamp(1.8rem, 6vw, 2.4rem);
  font-weight: bold;
  display: block;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 40px;
  border: none;
  font-size: 1.05rem;
  font-weight: bold;
  background: linear-gradient(135deg, #ff9800, #ff1744);
  color: #fff;
  cursor: pointer;
}

.newyear {
  font-size: clamp(2rem, 7vw, 2.8rem);
  font-weight: bold;
  color: #ffd700;
  margin-top: 20px;
  display: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
  <h1>Countdown to New Year</h1>

  <div class="timer" id="countdown">
    <div class="time-box"><span class="number" id="days">0</span>Days</div>
    <div class="time-box"><span class="number" id="hours">0</span>Hours</div>
    <div class="time-box"><span class="number" id="minutes">0</span>Minutes</div>
    <div class="time-box"><span class="number" id="seconds">0</span>Seconds</div>
  </div>

  <button id="sampleBtn" onclick="sampleFireworks()">🎆 Sample Fireworks</button>

  <div class="newyear" id="newYearText">🎉 Happy New Year! 🎉</div>
</div>

<script>
/* ===============================
   FULLSCREEN + ROTATION
================================ */
function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

async function lockLandscape() {
  try {
    if (screen.orientation?.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch {}
}

/* First user interaction triggers fullscreen */
document.addEventListener("click", () => {
  enterFullscreen();
  lockLandscape();
  requestWakeLock();
}, { once: true });

/* ===============================
   WAKE LOCK (KEEP SCREEN ON)
================================ */
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch {}
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    requestWakeLock();
  }
});

/* ===============================
   COUNTDOWN
================================ */
const targetYear = new Date().getFullYear() + 1;
const newYearDate = new Date(`January 1, ${targetYear} 00:00:00`);

const d = document.getElementById("days");
const h = document.getElementById("hours");
const m = document.getElementById("minutes");
const s = document.getElementById("seconds");
const textNY = document.getElementById("newYearText");
const countdown = document.getElementById("countdown");
const sampleBtn = document.getElementById("sampleBtn");

const timer = setInterval(() => {
  const diff = newYearDate - Date.now();

  if (diff <= 0) {
    clearInterval(timer);
    countdown.style.display = "none";
    textNY.style.display = "block";
    sampleBtn.style.display = "none";
    startFireworks();
    return;
  }

  d.textContent = Math.floor(diff / 86400000);
  h.textContent = Math.floor(diff / 3600000 % 24);
  m.textContent = Math.floor(diff / 60000 % 60);
  s.textContent = Math.floor(diff / 1000 % 60);
}, 1000);

/* ===============================
   FIREWORKS (SMALL + MOBILE SAFE)
================================ */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = innerWidth * ratio;
  canvas.height = innerHeight * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
resize();
addEventListener("resize", resize);

let running = false;
const particles = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function launch() {
  const x = rand(60, innerWidth - 60);
  const y = rand(80, innerHeight / 2);
  const colors = ["#ff0043","#14fc56","#1e90ff","#ffd700","#ff7f00"];

  for (let i = 0; i < 60; i++) {
    particles.push({
      x, y,
      r: rand(0.8, 1.8),
      c: colors[Math.floor(Math.random() * colors.length)],
      a: rand(0, Math.PI * 2),
      sp: rand(2, 4.5),
      g: rand(0.015, 0.03),
      al: 1
    });
  }
}

function animate() {
  if (!running) return;

  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += Math.cos(p.a) * p.sp;
    p.y += Math.sin(p.a) * p.sp + p.g;
    p.al -= 0.02;

    if (p.al <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = p.al;
    ctx.shadowBlur = 6;
    ctx.shadowColor = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c;
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

function startFireworks() {
  if (running) return;
  running = true;
  requestWakeLock();

  setInterval(() => {
    launch();
    if (Math.random() > 0.7) launch();
  }, 600);

  animate();
}

function sampleFireworks() {
  sampleBtn.style.display = "none";
  startFireworks();

  setTimeout(() => {
    running = false;
    particles.length = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 7000);
}
</script>

</body>
</html>
