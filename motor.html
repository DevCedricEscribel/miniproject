<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Speedometer & Odometer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: #0f0;
    }
    h1 { color: #0ff; }
    .data-box {
      margin: 20px;
      padding: 15px;
      border: 2px solid #0ff;
      border-radius: 10px;
      display: inline-block;
      min-width: 200px;
    }
    button {
      margin: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: #0ff;
      color: #111;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>GPS Speedometer & Odometer</h1>

  <div class="data-box">
    <h2>Speed</h2>
    <p id="speed">0 km/h</p>
  </div>

  <div class="data-box">
    <h2>Odometer</h2>
    <p id="distance">0.00 km</p>
  </div>

  <div class="data-box">
    <h2>Tilt</h2>
    <p id="tilt">Pitch: 0°<br>Roll: 0°</p>
  </div>

  <button onclick="enableSensors()">Enable Sensors</button>

  <script>
    let lastLat = null, lastLon = null;
    let totalDistance = 0;

    // --- GPS SPEED + ODOMETER ---
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0; // m/s to km/h

          document.getElementById("speed").innerText = speed.toFixed(1) + " km/h";

          if (lastLat !== null && lastLon !== null) {
            const d = haversine(lastLat, lastLon, lat, lon);
            totalDistance += d;
            document.getElementById("distance").innerText = totalDistance.toFixed(2) + " km";
          }

          lastLat = lat;
          lastLon = lon;
        },
        (err) => console.error("GPS error:", err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    } else {
      alert("Geolocation not supported.");
    }

    // --- Haversine formula for distance ---
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI/180;
      const dLon = (lon2 - lon1) * Math.PI/180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // --- GYROSCOPE / ORIENTATION ---
    async function enableSensors() {
      if (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        // iOS Safari
        const response = await DeviceMotionEvent.requestPermission();
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
        } else {
          alert("Permission denied for motion sensors.");
        }
      } else {
        // Android Chrome
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    function handleOrientation(event) {
      const pitch = event.beta;   // front-back
      const roll = event.gamma;   // left-right
      document.getElementById("tilt").innerHTML =
        "Pitch: " + pitch.toFixed(1) + "°<br>Roll: " + roll.toFixed(1) + "°";
    }
  </script>
</body>
</html>
