<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Speedometer with Horizon</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 15px; }

    /* Speedometer */
    .gauge {
      position: relative;
      width: 300px;
      height: 150px;
      margin: 20px auto;
    }
    svg { width: 100%; height: 100%; }
    .needle {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 140px;
      background: red;
      transform-origin: bottom center;
      transform: rotate(-90deg);
      transition: transform 0.3s ease-out;
    }

    .digital {
      margin-top: 20px;
      font-size: 1.5em;
    }
    .value {
      font-size: 2.5em;
      font-weight: bold;
      color: #00eaff;
    }

    /* Artificial Horizon */
    .horizon-container {
      width: 250px;
      height: 250px;
      margin: 30px auto;
      border: 3px solid #555;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: black;
    }
    .horizon {
      width: 300%;
      height: 300%;
      position: absolute;
      top: -100%;
      left: -100%;
      background: linear-gradient(#4da6ff 50%, #8b5a2b 50%);
      transform-origin: center;
      transition: transform 0.1s linear;
    }

    .info {
      margin-top: 15px;
      font-size: 0.9em;
      color: #aaa;
    }
    button {
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #0077cc;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <h1>🚗 GPS Speedometer + Horizon</h1>

  <!-- Speedometer -->
  <div class="gauge">
    <svg viewBox="0 0 200 100">
      <path d="M10 100 A90 90 0 0 1 190 100"
            fill="none" stroke="#555" stroke-width="20"/>
      <path d="M10 100 A90 90 0 0 1 190 100"
            fill="none" stroke="#00eaff" stroke-width="20"
            stroke-dasharray="280" stroke-dashoffset="0"/>
      <text x="20" y="95" fill="#ccc" font-size="12">0</text>
      <text x="95" y="30" fill="#ccc" font-size="12">100</text>
      <text x="170" y="95" fill="#ccc" font-size="12">200</text>
    </svg>
    <div class="needle" id="needle"></div>
  </div>

  <!-- Digital Readouts -->
  <div class="digital">
    <div class="value" id="speed">--</div>
    <div>km/h</div>
    <div id="odometer">Odometer: 0.000 km</div>
  </div>

  <!-- Gyroscope Horizon -->
  <div class="horizon-container">
    <div class="horizon" id="horizon"></div>
  </div>

  <div class="info" id="status">Tap "Start Tracking" to begin.</div>
  <button id="startBtn">Start Tracking</button>

  <script>
    let watchId = null;
    let prevLat = null, prevLon = null, prevTime = null;
    let odometer = 0;

    function toRad(deg) { return deg * Math.PI / 180; }
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateGauge(speedKmh, distance, acc) {
      document.getElementById("speed").textContent = speedKmh.toFixed(1);
      document.getElementById("odometer").textContent = 
        "Odometer: " + (distance/1000).toFixed(3) + " km";
      document.getElementById("status").textContent =
        `Accuracy: ${acc ? acc + "m" : "unknown"} | ${new Date().toLocaleTimeString()}`;

      const angle = Math.min(200, Math.max(0, speedKmh)) * (180/200) - 90;
      document.getElementById("needle").style.transform = `rotate(${angle}deg)`;
    }

    function startTracking() {
      if (!navigator.geolocation) {
        document.getElementById("status").textContent = "Geolocation not supported.";
        return;
      }

      odometer = 0;
      prevLat = prevLon = prevTime = null;

      watchId = navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;
        const now = Date.now();

        let speed = pos.coords.speed;
        if (prevLat !== null && prevLon !== null && prevTime !== null) {
          const d = haversine(prevLat, prevLon, lat, lon);
          const dt = (now - prevTime) / 1000;
          if (d > 0.5) odometer += d;
          if (speed === null && dt > 0) speed = d / dt;
        }

        if (speed === null) speed = 0;
        const speedKmh = speed * 3.6;
        updateGauge(speedKmh, odometer, acc);

        prevLat = lat; prevLon = lon; prevTime = now;
      }, err => {
        document.getElementById("status").textContent = "Error: " + err.message;
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
    }

    document.getElementById("startBtn").addEventListener("click", startTracking);

    /* Gyroscope Horizon */
    window.addEventListener("deviceorientation", e => {
      const roll = e.gamma || 0;   // left/right tilt (-90 to 90)
      const pitch = e.beta || 0;   // forward/back tilt (-180 to 180)
      const horizon = document.getElementById("horizon");

      // Roll rotates horizon, Pitch shifts up/down
      horizon.style.transform = 
        `rotate(${roll * -1}deg) translateY(${pitch / 2}px)`;
    });
  </script>
</body>
</html>
